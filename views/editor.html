<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ویرایشگر مانگا - نسخه ریش‌سفید (اصلاح شده + زیپ)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <style>
        /* فونت‌ها */
        @font-face { font-family: 'font'; src: url('public/fonts/.ttf'); }
        @font-face { font-family: 'a.gam.azad'; src: url('public/fonts/a.gam.azad.ttf'); }
        @font-face { font-family: 'bfarnaz'; src: url('public/fonts/bfarnaz.ttf'); }
        @font-face { font-family: 'afsaneh'; src: url('public/fonts/afsaneh.ttf'); }
        @font-face { font-family: 'bmorvard'; src: url('public/fonts/bmorvard.ttf'); }
        @font-face { font-family: 'bhoma'; src: url('public/fonts/bhoma.ttf'); }

        body { font-family: Arial, sans-serif; margin: 0; background: #0b0b0b; color: white; direction: rtl; overflow: hidden; height: 100vh; }
        
        /* پنل بالا */
        #topUI { 
            padding: 10px; background: #1a1a1a; border-bottom: 2px solid #333; 
            height: 165px; 
            box-sizing: border-box; 
            transition: all 0.4s ease-in-out;
            display: flex; flex-direction: column;
            z-index: 1000; position: relative;
        }
        #topUI.collapsed {
            height: 0; padding: 0; overflow: hidden; border-bottom: none;
        }

        #uiToggleBtn {
            position: fixed; top: 10px; left: 10px; z-index: 9999;
            background: #007bff; color: white; border: none; border-radius: 50%;
            width: 30px; height: 30px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* استایل باکس متن */
        .input-container {
            flex: 1; display: flex; gap: 5px; height: 100%;
        }
        textarea { 
            flex: 1; height: 85px; padding: 10px; font-size: 14px; 
            box-sizing: border-box; border-radius: 5px; background: #222; 
            color: #fff; border: 1px solid #444; resize: none; 
            line-height: 24px; white-space: pre; overflow-y: scroll;
        }
        textarea:focus { outline: 2px solid #007bff; background: #2a2a2a; }
        
        .buttons { margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
        .upload-btn { display: inline-flex; align-items: center; justify-content: center; padding: 4px 10px; font-size: 11px; background-color: #007bff; color: white; cursor: pointer; border-radius: 4px; border: none; text-decoration: none; height: 28px; transition: 0.2s; }
        .upload-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .upload-btn:disabled { background-color: #555 !important; cursor: not-allowed; opacity: 0.7; transform: none; }

        /* استایل لیست صفحات */
        #pagesList { display: flex; gap: 5px; margin-top: 5px; overflow-x: auto; padding: 4px; background: #000; border-radius: 5px; height: 40px; align-items: center; }
        .page-thumb { 
            padding: 4px 12px; background: #333; border: 2px solid #555; border-radius: 6px; 
            cursor: pointer; font-size: 14px; white-space: nowrap; transition: 0.2s; 
            color: #fff; font-weight: 900; text-shadow: 0 1px 3px rgba(0,0,0,1);
        }
        .page-thumb:hover { background: #444; border-color: #777; }
        .page-thumb.active { background: #007bff; border-color: #fff; color: white; transform: scale(1.05); z-index: 2; }

        #mainContainer { display: flex; height: calc(100vh - 165px); gap: 2px; background: #111; overflow: hidden; transition: height 0.4s; }
        body.ui-collapsed #mainContainer { height: 100vh; }
        
        .image-wrapper { flex: 1; overflow: auto; position: relative; background: #000; border: 1px solid #333; transition: all 0.3s ease; }
        #canvasHost { position: absolute; top: 0; left: 0; pointer-events: none; }
        .canvas-container-wrapper { position: relative; display: block; width: fit-content; margin: 0 auto; }
        img { display: block; user-select: none; pointer-events: auto; max-width: none; }
        
        #floodCanvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        #markerOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

        .marker {
            position: absolute; background: rgba(255, 0, 0, 0.75); color: white; width: 24px; height: 24px; border-radius: 50%;
            text-align: center; line-height: 24px; font-size: 12px; font-weight: bold; cursor: pointer;
            z-index: 100; transform: translate(-50%, -50%); border: 2px solid white;
            pointer-events: auto; box-shadow: 0 3px 6px rgba(0,0,0,0.6);
        }
        .marker:hover { background: red; transform: translate(-50%, -50%) scale(1.2); }

        /* منوی استایل */
        #style-menu {
            position: fixed; background: rgba(20, 20, 20, 0.95); border: 1px solid #007bff; border-radius: 8px;
            display: none; flex-direction: column; width: 280px; padding: 15px; z-index: 99999;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8); direction: rtl; backdrop-filter: blur(5px);
        }
        
        .menu-section { color: #007bff; font-size: 11px; margin: 8px 0 4px 0; border-bottom: 1px solid #333; font-weight: bold; padding-bottom: 2px; }
        .style-grid { display: flex; flex-wrap: wrap; gap: 4px; }
        .style-item { flex: 1 1 30%; background: #333; color: #ddd; padding: 4px 0; text-align: center; font-size: 11px; border-radius: 3px; cursor: pointer; border: 1px solid #444; transition: 0.2s; }
        .style-item:hover { background: #444; color: #fff; border-color: #666; }
        
        .color-palette { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
        #customColor, #strokeColor { width: 30px; height: 30px; border: none; cursor: pointer; background: none; padding: 0; }
        .quick-color { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #444; cursor: pointer; transition: 0.2s; }
        
        .btn-action { background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; width: 100%; margin-top: 5px; }
        .hidden-panel { display: none !important; }
        
        /* حالت تمرکز */
        .focus-active #topUI { opacity: 0.1; pointer-events: none; }
        .focus-active #focusModeBtn {
            position: fixed; top: 10px; right: 60px; z-index: 10001; 
            pointer-events: auto !important; opacity: 1 !important;
            box-shadow: 0 0 10px #007bff;
        }
        .focus-active #cleanWrapper { flex: 100%; } 

        #line-selector-ui {
            position: fixed; display: none; gap: 5px; z-index: 100000; align-items: center; direction: ltr;
            background: rgba(0,0,0,0.6); padding: 5px; border-radius: 20px;
        }
        .line-circle {
            width: 28px; height: 28px; border-radius: 50%; background: #222; color: #fff;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            cursor: pointer; border: 1px solid #555;
            font-size: 12px; transition: 0.2s;
        }
        .line-circle:hover { transform: scale(1.15); background: #007bff; border-color: #007bff; }
        .line-circle.active { background: #007bff; border-color: #fff; box-shadow: 0 0 8px #007bff; }
        .line-next-btn {
            width: 20px; height: 20px; border-radius: 50%; background: #444; color: white;
            display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 10px;
        }
    </style>
</head>
<body onload="preloadFonts();">

<button id="uiToggleBtn" onclick="toggleTopUI()">
    <span class="material-icons">expand_less</span>
</button>

<div id="line-selector-ui">
    <div id="circle-container" style="display: flex; gap: 5px;"></div>
    <div class="line-next-btn" onclick="toggleLineRange()"> &gt; </div>
</div>

<div id="topUI">
    <div class="input-container">
        <textarea id="textInput" placeholder="متن‌ها را اینجا وارد کنید...&#10;خطوط خالی کاملاً نادیده گرفته می‌شوند.&#10;دکمه حذف روی حباب، متن را شیفت می‌دهد."></textarea>
    </div>
    <div class="buttons">
        <label class="upload-btn" for="uploadOriginal"><span class="material-icons" style="font-size:14px;margin-left:4px;">image</span>اصلی</label>
        <input type="file" id="uploadOriginal" accept="image/*" multiple style="display:none">
        
        <label class="upload-btn" for="uploadClean" style="background:#6c757d"><span class="material-icons" style="font-size:14px;margin-left:4px;">brush</span>کلین</label>
        <input type="file" id="uploadClean" accept="image/*" multiple style="display:none">
        
        <button id="toggleOriginal" class="upload-btn" style="background: #dc3545;">چپ/راست (اصلی)</button>
        <button id="toggleClean" class="upload-btn" style="background: #28a745;">چپ/راست (کلین)</button>
        
        <button id="downloadBtn" class="upload-btn" style="background: #ffc107; color: #000;">دانلود همه (ZIP)</button>
        <button onclick="addNewFabricText()" class="upload-btn" style="background: #e83e8c;">+ دستی</button>
        <button id="undoBtn" class="upload-btn" style="background: #6f42c1;">برگشت (Undo)</button>
        <button onclick="fullReset()" class="upload-btn" style="background: #333;">ریست</button>
        <button id="focusModeBtn" class="upload-btn" style="background: #000; border: 1px solid #007bff;">حالت تمرکز</button>
    </div>
    <div id="pagesList"></div>
</div>

<div id="mainContainer">
    <div class="image-wrapper" id="cleanWrapper">
        <div class="canvas-container-wrapper" id="canvasWrapper">
            <img id="cleanImage" src="" alt="">
            <div id="canvasHost">
                <canvas id="c"></canvas>
            </div>
        </div>
    </div>

    <div class="image-wrapper" id="originalWrapper">
        <div class="canvas-container-wrapper">
            <img id="originalImage" src="" alt="" style="cursor: crosshair;">
            <canvas id="floodCanvas"></canvas>
            <div id="markerOverlay"></div>
        </div>
    </div>
</div>

<div id="style-menu">
    <div class="menu-section">فونت</div>
    <div class="style-grid">
        <div class="style-item" onclick="applyFont('font', 'font.ttf')">عادی</div>
        <div class="style-item" onclick="applyFont('a.gam.azad', 'a.gam.azad.ttf')">لرزش</div>
        <div class="style-item" onclick="applyFont('bfarnaz', 'bfarnaz.ttf')">مستطیل</div>
        <div class="style-item" onclick="applyFont('afsaneh', 'afsaneh.ttf')">فریاد</div>
        <div class="style-item" onclick="applyFont('bmorvard', 'bmorvard.ttf')">فکر</div>
        <div class="style-item" onclick="applyFont('bhoma', 'bhoma.ttf')">توضیح</div>
    </div>
    <div class="menu-section">رنگ متن</div>
    <div class="color-palette">
        <div class="quick-color" style="background:#000000" onclick="changeColor('#000000')"></div>
        <div class="quick-color" style="background:#ffffff" onclick="changeColor('#ffffff')"></div>
        <div class="quick-color" style="background:#ff0000" onclick="changeColor('#ff0000')"></div>
        <div class="quick-color" style="background:#0000ff" onclick="changeColor('#0000ff')"></div>
        <input type="color" id="customColor" oninput="changeColor(this.value)">
    </div>
    <div class="menu-section">دورخط (Stroke)</div>
    <div class="color-palette">
        <div class="quick-color" style="background:transparent; border:1px dashed #fff" onclick="changeStrokeWidth(0)"></div>
        <div class="quick-color" style="background:#fff" onclick="changeStrokeColor('#ffffff'); changeStrokeWidth(3)"></div>
        <input type="color" id="strokeColor" oninput="changeStrokeColor(this.value)">
        <input type="range" id="strokeWidth" min="0" max="10" value="0" step="0.5" oninput="changeStrokeWidth(this.value)" style="width: 60px;">
    </div>
    <div class="menu-section">فونت شخصی</div>
    <input type="file" id="fontUpload" accept=".ttf,.otf" style="display:none" onchange="addNewFont(event)">
    <button class="btn-action" onclick="document.getElementById('fontUpload').click()">آپلود فونت</button>
    <div id="custom-fonts-list" class="style-grid" style="margin-top:5px;"></div>
</div>

<script>
    const GLOBAL_UPLOAD_LIMIT = 50; 
    const MAX_UNDO = 17;

    let globalSkippedIndices = new Set();

    function preloadFonts() {
        const fonts = [
            { name: 'font', url: '1/font.ttf' },
            { name: 'a.gam.azad', url: '1/a.gam.azad.ttf' },
            { name: 'bfarnaz', url: '1/bfarnaz.ttf' },
            { name: 'afsaneh', url: '1/afsaneh.ttf' },
            { name: 'bmorvard', url: '1/bmorvard.ttf' },
            { name: 'bhoma', url: '1/bhoma.ttf' }
        ];
        
        fonts.forEach(f => {
            const fontFace = new FontFace(f.name, `url(${f.url})`);
            fontFace.load().then((loadedFont) => {
                document.fonts.add(loadedFont);
            }).catch(err => console.warn(`Font ${f.name} error.`, err));
        });
    }

    function fullReset() {
        if(confirm("همه چیز پاک شود؟")) {
            globalSkippedIndices.clear();
            location.reload();
        }
    }

    function toggleTopUI() {
        const topUI = document.getElementById('topUI');
        const btn = document.getElementById('uiToggleBtn');
        const icon = btn.querySelector('.material-icons');
        
        topUI.classList.toggle('collapsed');
        document.body.classList.toggle('ui-collapsed');
        
        if (topUI.classList.contains('collapsed')) {
            icon.innerText = 'expand_more';
        } else {
            icon.innerText = 'expand_less';
        }
    }

    let pages = [];
    let currentPageIdx = 0;
    let markersData = [];
    let fabricTexts = [];
    let undoStack = [];

    const originalImg = document.getElementById('originalImage');
    const cleanImg = document.getElementById('cleanImage');
    const floodCanvas = document.getElementById('floodCanvas');
    const fCtx = floodCanvas.getContext('2d');
    const textInput = document.getElementById('textInput');
    const menu = document.getElementById('style-menu');
    const canvasWrapper = document.getElementById('canvasWrapper');

    const canvas = new fabric.Canvas('c', {
        selection: false, centeredRotation: true, renderOnAddRemove: true
    });

    fabric.Object.prototype.objectCaching = false;

    fabric.Object.prototype.set({
        transparentCorners: false, cornerStyle: 'circle', cornerColor: '#007bff', 
        cornerStrokeColor: '#fff', cornerSize: 12, padding: 5,
        originX: 'center', originY: 'center', backgroundColor: 'rgba(255,255,255,0.01)'
    });

    canvas.on('mouse:wheel', function(opt) {
        if (opt.e.ctrlKey) { 
            let delta = opt.e.deltaY;
            let zoom = canvas.getZoom();
            zoom *= 0.999 ** delta;
            if (zoom > 10) zoom = 10;
            if (zoom < 0.1) zoom = 0.1;
            canvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
            opt.e.preventDefault();
            opt.e.stopPropagation();
        }
    });

    function handleFiles(files, type) {
        Array.from(files).forEach((file, i) => {
            const url = URL.createObjectURL(file);
            if (!pages[i]) {
                pages[i] = { 
                    originalSrc: "", cleanSrc: "", 
                    markersData: [], 
                    fabricJSON: JSON.stringify(canvas.toJSON()) 
                };
            }
            if (type === 'original') pages[i].originalSrc = url;
            else pages[i].cleanSrc = url;
        });
        updateThumbs();
        if (pages.length > 0 && !cleanImg.src) switchPage(0);
    }

    document.getElementById('uploadOriginal').addEventListener('change', e => handleFiles(e.target.files, 'original'));
    document.getElementById('uploadClean').addEventListener('change', e => handleFiles(e.target.files, 'clean'));

    function saveCurrentPageState() {
        if (pages[currentPageIdx]) {
            pages[currentPageIdx].markersData = [...markersData];
            pages[currentPageIdx].fabricJSON = JSON.stringify(canvas.toJSON());
        }
    }

    // --- اصلاح شده برای سرعت بالاتر ---
    function switchPage(idx) {
        saveCurrentPageState();
        currentPageIdx = idx;
        const p = pages[idx];
        
        // غیرفعال کردن رندر خودکار هنگام لود
        canvas.renderOnAddRemove = false; 

        originalImg.src = p.originalSrc || "";
        cleanImg.src = p.cleanSrc || "";
        
        markersData = p.markersData || [];
        undoStack = [];
        
        // پاک کردن دستی برای اطمینان
        canvas.clear(); 
        
        canvas.loadFromJSON(p.fabricJSON || '{"objects":[],"background":""}', () => {
            // فعال کردن مجدد رندر
            canvas.renderOnAddRemove = true;
            canvas.requestRenderAll();
            
            fabricTexts = canvas.getObjects().filter(obj => obj.type === 'textbox');
            syncTextFromGlobalSource();
            updateThumbs();
            drawUI();
        });
    }

    function updateThumbs() {
        const list = document.getElementById('pagesList');
        list.innerHTML = "";
        pages.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = `page-thumb ${i === currentPageIdx ? 'active' : ''}`;
            div.innerText = `${i + 1}`;
            div.onclick = () => switchPage(i);
            list.appendChild(div);
        });
    }

    function saveState() {
        undoStack.push(JSON.stringify(canvas.toJSON()));
        if (undoStack.length > MAX_UNDO) undoStack.shift();
    }

    document.getElementById('undoBtn').addEventListener('click', () => {
        if (undoStack.length > 0) {
            const state = undoStack.pop();
            canvas.loadFromJSON(state, () => {
                canvas.renderAll();
                fabricTexts = canvas.getObjects().filter(obj => obj.type === 'textbox');
                syncTextFromGlobalSource();
            });
        }
    });

    function renderIcon(iconName, extraScale = 1) {
        return function(ctx, left, top, styleOverride, fabricObject) {
            const size = 20 * extraScale; 
            ctx.save(); 
            ctx.translate(left, top);
            ctx.rotate(fabric.util.degreesToRadians(fabricObject.angle));
            ctx.beginPath(); 
            ctx.arc(0, 0, size/2, 0, Math.PI * 2, false);
            ctx.fillStyle = "#fff"; ctx.fill(); ctx.strokeStyle = "#007bff"; ctx.stroke();
            ctx.fillStyle = "#000"; ctx.font = (12 * extraScale) + 'px "Material Icons"';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(iconName, 0, 0); 
            ctx.restore();
        }
    }

    const ctl = fabric.Textbox.prototype.controls;
    
    ctl.delete = new fabric.Control({ 
        x: -0.5, y: -0.5, offsetX: -15, offsetY: -15, 
        mouseUpHandler: (e, t) => {
            saveState();
            const target = t.target;
            if (target && typeof target.associatedLineIndex === 'number') {
                globalSkippedIndices.add(target.associatedLineIndex);
                syncTextFromGlobalSource();
            } else {
                canvas.remove(target);
                fabricTexts = fabricTexts.filter(ft => ft !== target);
            }
            return true;
        }, 
        render: renderIcon('close') 
    });
    
    ctl.styleMenuTrigger = new fabric.Control({
        x: 0, y: 0.5, offsetX: 0, offsetY: 20, cursorStyle: 'pointer',
        mouseUpHandler: (e, t) => {
            const isVisible = menu.style.display === 'flex';
            menu.style.display = isVisible ? 'none' : 'flex';
            if (!isVisible) updateMenuPos();
            return true;
        },
        render: renderIcon('palette') 
    });

    ctl.sizeResizer = new fabric.Control({
        x: 0.5, y: 0.5, offsetX: 15, offsetY: 15, cursorStyle: 'nwse-resize',
        actionHandler: fabric.controlsUtils.scalingEqually, actionName: 'scale',
        render: renderIcon('format_size', 1.1) 
    });

    ctl.mr = new fabric.Control({
        x: 0.5, y: 0, offsetX: 15, cursorStyle: 'ew-resize',
        actionHandler: fabric.controlsUtils.changeWidth, actionName: 'resizing',
        render: renderIcon('compare_arrows', 1) 
    });

    delete ctl.styleToggle;
    ctl.mtr = new fabric.Control({ x: 0.5, y: -0.5, offsetX: 15, offsetY: -15, actionHandler: fabric.controlsUtils.rotationWithSnapping, render: renderIcon('sync') });

    function getAvailableLines() {
        const rawLines = textInput.value.split('\n');
        let available = [];
        rawLines.forEach((line, index) => {
            // با استفاده از trim تمام فاصله‌های اضافی اول و آخر گرفته می‌شود
            // اگر بعد از این کار طول متن بیشتر از 0 بود، یعنی متن واقعی است
            if (line.trim().length > 0 && !globalSkippedIndices.has(index)) {
                available.push({ text: line, originalIndex: index });
            }
        });
        return available;
    }

    textInput.addEventListener('input', () => {
        syncTextFromGlobalSource();
    });

    function getPreviousPagesBubbleCount(pageIdx) {
        let count = 0;
        for(let i = 0; i < pageIdx; i++) {
            if(pages[i] && pages[i].markersData) {
                count += pages[i].markersData.length;
            }
        }
        return count;
    }

    function syncTextFromGlobalSource() {
        const availableLines = getAvailableLines();
        const startOffset = getPreviousPagesBubbleCount(currentPageIdx);

        fabricTexts.forEach((textObj, i) => {
            const globalBubbleIndex = startOffset + i;
            if (globalBubbleIndex < availableLines.length) {
                const lineData = availableLines[globalBubbleIndex];
                const newText = lineData.text;
                textObj.visible = true;
                textObj.originalText = newText;
                textObj.associatedLineIndex = lineData.originalIndex;
                const mode = textObj.circleMode || (newText.length > 8 ? 3 : null);
                if (mode) {
                   textObj.set('text', applyMangaCircleLogic(newText, mode));
                } else {
                   textObj.set('text', newText);
                }
            } else {
                textObj.visible = false;
                textObj.text = "";
                textObj.associatedLineIndex = -1;
            }
        });
        canvas.requestRenderAll(); 
    }
    
    function removeMarker(localIndex) {
        markersData.splice(localIndex, 1);
        if (fabricTexts[localIndex]) {
            canvas.remove(fabricTexts[localIndex]);
            fabricTexts.splice(localIndex, 1);
        }
        saveState();
        drawUI();
        syncTextFromGlobalSource();
    }

    originalImg.onload = () => {
        floodCanvas.width = originalImg.naturalWidth;
        floodCanvas.height = originalImg.naturalHeight;
    };

    cleanImg.onload = () => {
        canvas.setWidth(cleanImg.naturalWidth);
        canvas.setHeight(cleanImg.naturalHeight);
        canvas.getElement().style.width = cleanImg.clientWidth + 'px';
        canvas.getElement().style.height = cleanImg.clientHeight + 'px';
    };

    originalImg.addEventListener('click', e => {
        if(!originalImg.naturalWidth) return;
        saveState();
        const rect = originalImg.getBoundingClientRect();
        const scaleX = originalImg.naturalWidth / rect.width;
        const scaleY = originalImg.naturalHeight / rect.height;
        const x = Math.floor((e.clientX - rect.left) * scaleX);
        const y = Math.floor((e.clientY - rect.top) * scaleY);
        
        const markerObj = { x: x, y: y, w: 300, h: 300 };
        markersData.push(markerObj);

        const textObj = new fabric.Textbox("", {
             left: x, top: y, fontFamily: 'font', fill: '#000000',
             fontSize: 45, textAlign: 'center', 
             width: 180, minHeight: 50, direction: 'rtl', 
             editable: false, splitByGrapheme: false,
             lineHeight: 1.1
        });
        
        fabricTexts.push(textObj);
        canvas.add(textObj);
        canvas.setActiveObject(textObj);
        syncTextFromGlobalSource();
        drawUI();
    });

    canvas.on('object:modified', () => saveState());

    function drawUI() {
        document.getElementById('markerOverlay').innerHTML = '';
        if(fCtx) fCtx.clearRect(0, 0, floodCanvas.width, floodCanvas.height);
        
        if (document.getElementById('originalWrapper').classList.contains('hidden-panel')) return;

        const globalOffset = getPreviousPagesBubbleCount(currentPageIdx);

        markersData.forEach((data, i) => {
            fCtx.fillStyle = "rgba(255, 215, 0, 0.4)";
            fCtx.beginPath(); fCtx.arc(data.x, data.y, 80, 0, Math.PI*2); fCtx.fill();

            const dot = document.createElement('div');
            dot.className = 'marker';
            dot.style.left = (data.x / originalImg.naturalWidth * 100) + '%';
            dot.style.top = (data.y / originalImg.naturalHeight * 100) + '%';
            dot.innerText = globalOffset + i + 1;
            dot.onclick = (e) => { e.stopPropagation(); removeMarker(i); };
            document.getElementById('markerOverlay').appendChild(dot);
        });
    }

    document.getElementById('toggleOriginal').addEventListener('click', () => {
        document.getElementById('originalWrapper').classList.toggle('hidden-panel');
    });
    document.getElementById('toggleClean').addEventListener('click', () => {
        document.getElementById('cleanWrapper').classList.toggle('hidden-panel');
    });

    canvasWrapper.addEventListener('mousedown', (e) => {
        if (canvas.findTarget(e)) document.getElementById('canvasHost').style.pointerEvents = "auto";
    }, true);

    canvas.on('mouse:down', (opt) => {
        if (!opt.target) {
            document.getElementById('canvasHost').style.pointerEvents = "none";
            canvas.discardActiveObject().requestRenderAll();
            menu.style.display = 'none';
        }
    });

    canvas.on('object:moving', updateMenuPos);
    canvas.on('object:scaling', updateMenuPos);
    canvas.on('selection:cleared', () => menu.style.display = 'none');
    
    function applyFont(fontName, fileName) { 
        saveState(); 
        const obj = canvas.getActiveObject(); 
        if(!obj || obj.type !== 'textbox') return;
        if(!fileName) { obj.set('fontFamily', fontName); canvas.requestRenderAll(); return; }

        const fontPath = `1/${fileName}`;
        const fontFace = new FontFace(fontName, `url(${fontPath})`);
        fontFace.load().then(loadedFont => {
            document.fonts.add(loadedFont);
            obj.set('fontFamily', fontName);
            obj.set('dirty', true);
            canvas.requestRenderAll();
        }).catch(error => {
            console.error('Font error:', error);
            obj.set('fontFamily', 'Arial');
        });
    }
    
    canvas.on('selection:created', () => menu.style.display = 'none');

    function updateMenuPos() {
        const obj = canvas.getActiveObject(); 
        if (!obj || menu.style.display !== 'flex') return;
        
        const rect = canvas.getElement().getBoundingClientRect();
        const objCoords = obj.getBoundingRect();
        const scaleX = rect.width / canvas.width;
        const scaleY = rect.height / canvas.height;
        
        const menuW = 280; 
        let left = rect.left + (objCoords.left + objCoords.width / 2) * scaleX - (menuW / 2);
        let top = rect.top + (objCoords.top + objCoords.height) * scaleY + 20; 
        
        if(left + menuW > window.innerWidth) left = window.innerWidth - menuW - 10;
        if(left < 0) left = 10;
        
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
    }

    function changeColor(c) { saveState(); const o = canvas.getActiveObject(); if(o){ o.set('fill', c); canvas.requestRenderAll(); } }
    function changeStrokeColor(c) { saveState(); const o = canvas.getActiveObject(); if(o){ o.set('stroke', c); canvas.requestRenderAll(); } }
    function changeStrokeWidth(w) { saveState(); const o = canvas.getActiveObject(); if(o){ o.set('strokeWidth', parseFloat(w)); canvas.requestRenderAll(); } }

    function addNewFont(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const fontName = 'custom_' + Date.now();
            const newFont = new FontFace(fontName, `url(${e.target.result})`);
            newFont.load().then(loaded => {
                document.fonts.add(loaded);
                const item = document.createElement('div');
                item.className = 'style-item';
                item.innerText = file.name.substring(0,6);
                item.onclick = () => applyFont(fontName);
                document.getElementById('custom-fonts-list').appendChild(item);
            });
        };
        reader.readAsDataURL(file);
    }

    // --- تابع جدید دانلود زیپ ---
    document.getElementById('downloadBtn').addEventListener('click', async () => {
        const btn = document.getElementById('downloadBtn');
        const originalBtnText = btn.innerText;
        btn.disabled = true;
        
        saveCurrentPageState(); // ذخیره وضعیت صفحه فعلی قبل از پردازش
        
        const zip = new JSZip();
        const imgFolder = zip.folder("edited_pages");
        
        for (let i = 0; i < pages.length; i++) {
            const p = pages[i];
            if (!p.cleanSrc) continue;
            
            btn.innerText = `پردازش صفحه ${i+1}...`;

            await new Promise((resolve, reject) => {
                const offImg = new Image();
                offImg.onload = () => {
                    // ایجاد یک بوم موقت برای ترکیب عکس پس‌زمینه و متن‌ها
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = offImg.naturalWidth;
                    tempCanvas.height = offImg.naturalHeight;
                    const ctx = tempCanvas.getContext('2d');
                    
                    // 1. رسم عکس کلین
                    ctx.drawImage(offImg, 0, 0);
                    
                    // 2. ساخت بوم فابریک برای رندر کردن متن‌ها
                    // نکته: ما از یک بوم جداگانه برای متن استفاده می‌کنیم تا شفافیت حفظ شود
                    // سپس خروجی آن را روی بوم اصلی (ctx) رسم می‌کنیم
                    const tempFabric = new fabric.StaticCanvas(null, { width: tempCanvas.width, height: tempCanvas.height });
                    
                    tempFabric.loadFromJSON(p.fabricJSON, () => {
                        tempFabric.renderAll();
                        
                        // تبدیل لایه متن به عکس و رسم روی عکس اصلی
                        const textDataUrl = tempFabric.toDataURL({ format: 'png', multiplier: 1 });
                        const textImg = new Image();
                        textImg.onload = () => {
                            ctx.drawImage(textImg, 0, 0);
                            
                            // تبدیل نتیجه نهایی به Blob برای زیپ
                            tempCanvas.toBlob((blob) => {
                                imgFolder.file(`Page-${String(i+1).padStart(2, '0')}.png`, blob);
                                resolve();
                            }, 'image/png');
                        };
                        textImg.src = textDataUrl;
                    });
                };
                offImg.onerror = reject;
                offImg.src = p.cleanSrc;
            });
        }
        
        btn.innerText = "ساخت فایل زیپ...";
        
        zip.generateAsync({type:"blob"}).then(function(content) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = "manga_edited_images.zip";
            link.click();
            
            btn.innerText = originalBtnText;
            btn.disabled = false;
        });
    });

    function addNewFabricText() {
        saveState();
        const t = new fabric.Textbox('متن', {
            left: canvas.width/2, top: canvas.height/2, fontFamily: 'font', fill: '#000', 
            fontSize: 45, textAlign: 'center', width: 150, minHeight: 60, direction: 'rtl',
            editable: false
        });
        t.originalText = 'متن'; 
        canvas.add(t).setActiveObject(t);
        document.getElementById('canvasHost').style.pointerEvents = "auto";
    }

    let isFocusMode = false;
    document.getElementById('focusModeBtn').addEventListener('click', () => {
        isFocusMode = !isFocusMode;
        document.body.classList.toggle('focus-active');
        const originalWrapper = document.getElementById('originalWrapper');
        const focusBtn = document.getElementById('focusModeBtn');
        if (isFocusMode) {
            focusBtn.innerText = "خروج";
            focusBtn.style.background = "#007bff";
            originalWrapper.style.display = 'none'; 
            if(fCtx) fCtx.clearRect(0, 0, floodCanvas.width, floodCanvas.height); 
        } else {
            focusBtn.innerText = "تمرکز";
            focusBtn.style.background = "#000";
            originalWrapper.style.display = 'block';
            drawUI(); 
        }
    });

    const originalDrawUI = drawUI;
    drawUI = function() { if (!isFocusMode) originalDrawUI(); };

    let currentRangeStart = 2;
    const lineSelector = document.getElementById('line-selector-ui');
    const circleContainer = document.getElementById('circle-container');

    function updateLineCircles() {
        circleContainer.innerHTML = '';
        const obj = canvas.getActiveObject();
        for(let i = currentRangeStart; i < currentRangeStart + 4; i++) {
            const circle = document.createElement('div');
            circle.className = 'line-circle' + (obj && obj.circleMode === i ? ' active' : '');
            circle.innerText = i;
            circle.onclick = () => setLineMode(i);
            circleContainer.appendChild(circle);
        }
    }

    function toggleLineRange() {
        currentRangeStart = currentRangeStart === 2 ? 6 : 2;
        updateLineCircles();
    }

    // --- تابع جدید اعمال مود دایره‌ای ---
    function setLineMode(num) {
        const obj = canvas.getActiveObject();
        if(!obj || obj.type !== 'textbox') return;
        
        saveState();
        
        // استفاده از متن ذخیره شده برای جلوگیری از بهم ریختگی هنگام تغییر حالت
        let baseText = obj.originalText || obj.text.replace(/ـ/g, '').replace(/\n/g, ' ');

        if (obj.circleMode === num) {
            obj.circleMode = null;
            obj.set('text', baseText);
        } else {
            obj.circleMode = num;
            obj.set('text', applyMangaCircleLogic(baseText, num));
        }
        
        canvas.requestRenderAll();
        updateLineCircles();
    }

    canvas.on('selection:created', showLineUI);
    canvas.on('selection:updated', showLineUI);
    canvas.on('selection:cleared', () => lineSelector.style.display = 'none');
    canvas.on('object:moving', updateLineUIPos);
    canvas.on('object:scaling', updateLineUIPos);

    function showLineUI() {
        const obj = canvas.getActiveObject();
        if(obj && obj.type === 'textbox') {
            lineSelector.style.display = 'flex';
            updateLineCircles();
            updateLineUIPos();
        } else {
            lineSelector.style.display = 'none';
        }
    }

    function updateLineUIPos() {
        const obj = canvas.getActiveObject();
        if(!obj || lineSelector.style.display === 'none') return;
        const rect = canvas.getElement().getBoundingClientRect();
        const objCoords = obj.getBoundingRect();
        const scaleX = rect.width / canvas.width;
        const scaleY = rect.height / canvas.height;
        
        lineSelector.style.left = (rect.left + (objCoords.left + objCoords.width/2) * scaleX - 70) + 'px';
        lineSelector.style.top = (rect.top + objCoords.top * scaleY - 45) + 'px';
    }

    // --- تابع جدید و پیشرفته منطق دایره‌ای با پشتیبانی از کشیدگی (تطویل) ---
    function applyMangaCircleLogic(rawText, lineCount) {
        const basePatterns = {
            2: [2, 5], 
            3: [2, 6, 2], 
            4: [3, 6, 6, 3], 
            5: [3, 6, 8, 6, 3],
            6: [3, 6, 8, 8, 6, 3], 
            7: [3, 6, 8, 10, 8, 6, 3], 
            8: [3, 6, 8, 10, 10, 8, 6, 3],
            9: [3, 6, 8, 10, 12, 10, 8, 6, 3], 
            10: [3, 6, 8, 10, 12, 12, 10, 8, 6, 3]
        };
        const cannotConnectLeft = "ادذرزژوآء"; 
        const punctuation = " .،!؟:؛-()\"";
        
        let words = rawText.replace(/ـ/g, '').split(/\s+/);
        let pattern = basePatterns[lineCount] || [5];
        let totalChars = words.join("").length;
        let scaleFactor = Math.max(1.1, (totalChars + words.length) / pattern.reduce((a,b)=>a+b, 0));
        let targetLengths = pattern.map(w => Math.round(w * scaleFactor));

        let linesWords = Array.from({ length: lineCount }, () => []);
        let currentLine = 0;

        words.forEach(word => {
            let currentLineText = linesWords[currentLine].join(" ");
            if (currentLine < lineCount - 1) {
                let currentDist = Math.abs(targetLengths[currentLine] - currentLineText.length);
                let nextDist = Math.abs(targetLengths[currentLine] - (currentLineText + " " + word).length);
                if (nextDist > currentDist && currentLineText.length > 0) currentLine++;
            }
            linesWords[currentLine].push(word);
        });

        return linesWords.map((lineArr, idx) => {
            let lineText = lineArr.join(" ");
            let targetLen = targetLengths[idx];
            if (lineText.length >= targetLen) return lineText;
            
            let chars = lineText.split("");
            let diff = targetLen - lineText.length;
            let validSlots = [];
            for (let i = 0; i < chars.length - 1; i++) {
                if (!cannotConnectLeft.includes(chars[i]) && !punctuation.includes(chars[i]) && !punctuation.includes(chars[i+1])) {
                    validSlots.push(i);
                }
            }
            if (validSlots.length > 0) {
                let counter = 0;
                while (diff > 0) {
                    chars[validSlots[counter % validSlots.length]] += "ـ";
                    diff--; counter++;
                }
            }
            return chars.join("");
        }).join("\n");
    }
